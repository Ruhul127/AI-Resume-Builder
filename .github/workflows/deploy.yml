name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]  # Runs on pushes to 'main' branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # Check out your repo
      
      - name: Setup Pages
        uses: actions/configure-pages@v3  # Configures GitHub Pages
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2  # Uploads files for deployment
        with:
          path: '.'  # Deploys all files in the root
      
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v2  # Triggers the deployment
